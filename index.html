<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC Snackbar - Click & Collect</title>
  <style>
    :root {
      --primary: #FF6B00; /* Modernes Orange */
      --primary-hover: #E05E00;
      --bg: #F4F5F7;
      --card-bg: #FFFFFF;
      --text: #17191C;
      --text-muted: #7A869A;
      --border: #E2E8F0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Karussell / Slider für hervorgehobenes Produkt */
    .featured-container {
      position: relative;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      text-align: center;
      margin-bottom: 24px;
    }

    .featured-badge {
      display: inline-block;
      background: rgba(255, 107, 0, 0.1);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .featured-img-wrap {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .featured-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    .product-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0 0 4px 0;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 16px;
    }

    /* Slider Steuerung */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .nav-btn.prev { left: -12px; }
    .nav-btn.next { right: -12px; }

    /* Buttons & Formulare */
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #FAFAFA;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: #FFF;
    }

    /* Warenkorb Liste */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.95rem;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid var(--border);
    }

    .remove-btn {
      background: none;
      border: none;
      color: #E53E3E;
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: 8px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
    }

    .dot.active {
      background: var(--primary);
      width: 16px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>RC Snackbar</h1>
    <p>Click & Collect – Vorbestellen & Abholen</p>
  </header>

  <!-- Fokus-Produkt Slider -->
  <div class="featured-container">
    <button class="nav-btn prev" onclick="changeProduct(-1)">&#10094;</button>
    <button class="nav-btn next" onclick="changeProduct(1)">&#10095;</button>

    <div id="featured-card">
      <span class="featured-badge" id="p-badge">Snack</span>
      <div class="featured-img-wrap">
        <img id="p-img" src="" alt="Produktbild" onerror="this.src='https://via.placeholder.com/200x200?text=Kein+Bild'">
      </div>
      <h3 class="product-title" id="p-title">Lade Produkte...</h3>
      <div class="product-price" id="p-price">0,00 €</div>
      <button class="btn-primary" onclick="addToCart()">In den Warenkorb</button>
    </div>

    <div class="dots" id="dots-container"></div>
  </div>

  <!-- Warenkorb & Bestellung -->
  <div class="card">
    <h2>Deine Bestellung</h2>
    <div id="cart-list">
      <p style="color: var(--text-muted); font-size: 0.9rem;">Noch keine Artikel im Warenkorb.</p>
    </div>
    <div class="cart-total">
      <span>Gesamt:</span>
      <span id="cart-total-price">0,00 €</span>
    </div>
  </div>

  <!-- Abholdaten -->
  <div class="card">
    <h2>Abholdaten</h2>
    <form id="order-form" onsubmit="submitOrder(event)">
      <div class="form-group">
        <label for="studentName">Name & Vorname</label>
        <input type="text" id="studentName" placeholder="z. B. Max Mustermann" required>
      </div>

      <div class="form-group">
        <label for="studentClass">Klasse / Stufe</label>
        <input type="text" id="studentClass" placeholder="z. B. 8b oder MSS11" required>
      </div>

      <div class="form-group">
        <label for="pickupPause">Abholpause</label>
        <select id="pickupPause" required>
          <option value="">Bitte wählen...</option>
          <option value="1. Pause">1. Pause</option>
          <option value="2. Pause">2. Pause</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" style="margin-top: 10px;">Kostenpflichtig bestellen</button>
    </form>
  </div>
</div>

<script>
  // ERSETZE DIESE URL MIT DEINER APPS SCRIPT EXEC-URL!
  const API_URL = "https://script.google.com/macros/s/AKfycbwwBaAQcwmMrbOtsyQ3O4LzFyA9GZ58Iy9WBqS773zPzEYOsWRXvHUUXoTTmkrZmj19bQ/exec";

  let products = [];
  let currentIndex = 0;
  let cart = [];

  // Produkte vom Backend laden
  async function loadProducts() {
    try {
      const res = await fetch(API_URL);
      products = await res.json();
      if (products.length > 0) {
        renderProduct();
        renderDots();
      }
    } catch (e) {
      document.getElementById('p-title').innerText = "Fehler beim Laden";
    }
  }

  function renderProduct() {
    const p = products[currentIndex];
    document.getElementById('p-title').innerText = p.name;
    document.getElementById('p-price').innerText = Number(p.price).toFixed(2).replace('.', ',') + " €";
    document.getElementById('p-badge').innerText = p.isAction ? "Aktion" : "Snack";
    
    // Bildpfad auf GitHub Pages oder Unterordner `images/` festlegen
    document.getElementById('p-img').src = p.image;

    updateDots();
  }

  function changeProduct(direction) {
    if (products.length === 0) return;
    currentIndex = (currentIndex + direction + products.length) % products.length;
    renderProduct();
  }

  function renderDots() {
    const dotsWin = document.getElementById('dots-container');
    dotsWin.innerHTML = '';
    products.forEach((_, idx) => {
      const dot = document.createElement('div');
      dot.className = `dot ${idx === currentIndex ? 'active' : ''}`;
      dotsWin.appendChild(dot);
    });
  }

  function updateDots() {
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot, idx) => {
      dot.classList.toggle('active', idx === currentIndex);
    });
  }

  function addToCart() {
    if (products.length === 0) return;
    const p = products[currentIndex];
    cart.push(p);
    renderCart();
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function renderCart() {
    const cartList = document.getElementById('cart-list');
    const totalEl = document.getElementById('cart-total-price');

    if (cart.length === 0) {
      cartList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Noch keine Artikel im Warenkorb.</p>';
      totalEl.innerText = "0,00 €";
      return;
    }

    cartList.innerHTML = '';
    let total = 0;

    cart.forEach((item, index) => {
      total += Number(item.price);
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <span>${item.name}</span>
        <div>
          <span>${Number(item.price).toFixed(2).replace('.', ',')} €</span>
          <button class="remove-btn" onclick="removeFromCart(${index})">✕</button>
        </div>
      `;
      cartList.appendChild(row);
    });

    totalEl.innerText = total.toFixed(2).replace('.', ',') + " €";
  }

  async function submitOrder(e) {
    e.preventDefault();

    if (cart.length === 0) {
      alert("Dein Warenkorb ist leer!");
      return;
    }

    const payload = {
      studentName: document.getElementById('studentName').value,
      studentClass: document.getElementById('studentClass').value,
      pickupPause: document.getElementById('pickupPause').value,
      items: cart.map(i => i.name),
      totalPrice: cart.reduce((sum, i) => sum + Number(i.price), 0).toFixed(2).replace('.', ',')
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await res.json();
      if (result.status === "success") {
        alert("Bestellung erfolgreich aufgegeben!");
        cart = [];
        renderCart();
        document.getElementById('order-form').reset();
      } else {
        alert("Fehler bei der Bestellung. Bitte versuche es erneut.");
      }
    } catch (err) {
      alert("Netzwerkfehler beim Absenden der Bestellung.");
    }
  }

  loadProducts();
</script>

</body>
</html>
