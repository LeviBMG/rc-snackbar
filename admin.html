<!DOCTYPE html>
<html lang="de">
<!--
  =========================================================
  RC-Snackbar eSG - Admin Bestellpanel
  Version: Beta v0.9.6
  =========================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC-Snackbar eSG - Admin Bestellpanel (Beta v0.9.6)</title>
  <style>
    :root {
      --esg-navy: #1B2B4C;
      --esg-orange: #E87722;
      --esg-grey: #8A8D8F;
      --esg-light-grey: #F2F4F7;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --border: #E2E8F0;
      --radius: 12px;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }

    .container { max-width: 1200px; margin: 0 auto; }
    
    header {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    h1 { color: var(--esg-navy); margin: 0; font-size: 1.4rem; text-transform: uppercase; }
    
    .btn-refresh {
      background: var(--esg-orange);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-refresh:hover { background: #D06310; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: var(--esg-light-grey); color: var(--esg-navy); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; }
    
    .badge-pause { background: #E0F2FE; color: #0369A1; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; }
    
    .btn-done {
      background: #10B981;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-done:hover { background: #059669; }

    .empty-state { text-align: center; padding: 40px; color: var(--esg-grey); font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>RC-Snackbar eSG <span style="font-size: 0.7rem; color: var(--esg-orange);">Admin v0.9.6</span></h1>
        <p style="margin: 4px 0 0 0; font-size: 0.8rem; color: var(--esg-grey);">Live-Bestellpanel für das Verkaufsteam</p>
      </div>
      <button class="btn-refresh" onclick="loadOrders()">🔄 Aktualisieren</button>
    </header>

    <div class="card">
      <h2 style="margin-top: 0; color: var(--esg-navy); font-size: 1.1rem; border-bottom: 2px solid var(--esg-light-grey); padding-bottom: 8px;">Offene Bestellungen</h2>
      <div id="orders-container">
        <div class="empty-state">Lade Bestellungen...</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw9aWpl8uQIkN7JFDNzjNR_3G79c3tdsFeWNpWsUfstYGD3fUbwh0DCUgY1AU6mkxCWFQ/exec";

    async function loadOrders() {
      const container = document.getElementById('orders-container');
      container.innerHTML = '<div class="empty-state">Lade aktuelle Daten...</div>';

      try {
        const res = await fetch(`${API_URL}?action=getOrders`, { method: "GET", redirect: "follow" });
        const orders = await res.json();

        if (!Array.isArray(orders) || orders.length === 0) {
          container.innerHTML = '<div class="empty-state">Aktuell liegen keine offenen Bestellungen vor. 🎉</div>';
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>Uhrzeit</th>
                <th>Kunde & Klasse</th>
                <th>Abholfenster</th>
                <th>Bestellte Artikel</th>
                <th>Summe</th>
                <th>Aktion</th>
              </tr>
            </thead>
            <tbody>
        `;

        orders.forEach(o => {
          if (o.status === "Offen" || !o.status) {
            const timeStr = new Date(o.timestamp).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            html += `
              <tr>
                <td>${timeStr} Uhr</td>
                <td><strong>${o.name}</strong><br><span style="font-size:0.75rem; color:var(--esg-grey);">Klasse ${o.class}</span></td>
                <td><span class="badge-pause">${o.pickup}</span></td>
                <td>${o.items}</td>
                <td><strong>${o.total}</strong></td>
                <td><button class="btn-done" onclick="completeOrder(${o.rowIndex})">Abgeholt / Erledigt ✓</button></td>
              </tr>
            `;
          }
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

      } catch (err) {
        console.error("Fehler beim Laden:", err);
        container.innerHTML = '<div class="empty-state" style="color: #E53E3E;">Fehler beim Laden der Bestellungen. Bitte URL prüfen.</div>';
      }
    }

    async function completeOrder(rowIndex) {
      if (!confirm("Bestellung wirklich als abgeholt markieren und archivieren?")) return;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "completeOrder", rowIndex: rowIndex })
        });
        const result = await res.json();
        if (result.status === "success") {
          loadOrders();
        } else {
          alert("Fehler beim Aktualisieren.");
        }
      } catch (err) {
        alert("Netzwerkfehler.");
      }
    }

    // Automatisch alle 30 Sekunden aktualisieren
    setInterval(loadOrders, 30000);
    loadOrders();
  </script>
</body>
</html>
